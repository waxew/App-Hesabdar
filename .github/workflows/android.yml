name: Android APK

on:
  push:
    branches: ["main", "develop-v1", "release-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  RELEASE_KEYSTORE_BASE64: ${{ secrets.HESABDAR_RELEASE_KEYSTORE_BASE64 }}
  RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HESABDAR_RELEASE_KEYSTORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.HESABDAR_RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.HESABDAR_RELEASE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload stable test APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Hesabdar-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keystore خصوصی داخل Repository قرار نمی‌گیرد. این مرحله فقط در صورت تنظیم هر چهار Secret اجرا می‌شود.
      - name: Prepare release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_KEYSTORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hesabdar-release.jks"

      - name: Build signed release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_KEYSTORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        env:
          HESABDAR_KEYSTORE_PATH: ${{ runner.temp }}/hesabdar-release.jks
          HESABDAR_KEYSTORE_PASSWORD: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          HESABDAR_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          HESABDAR_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_KEYSTORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: App-Hesabdar-v1.0.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
